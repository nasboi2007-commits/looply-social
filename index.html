
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>Looply - Connect. Share. Belong.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#09090d;color:white;font-family:Arial,sans-serif}
button{cursor:pointer;border:0}
.hidden{display:none!important}
header{
height:60px;background:#111116;
display:flex;align-items:center;
justify-content:space-between;
padding:0 16px;border-bottom:1px solid #292934;
position:sticky;top:0;z-index:10
}
.logo{font-size:27px;font-weight:900}
.logo span{color:#fe2c55}
button{color:white}
.primary{background:#fe2c55;padding:12px 18px;border-radius:9px}
.panel{background:#17171f;border:1px solid #292934;
border-radius:12px;padding:15px;margin-bottom:15px}
input,textarea{
width:100%;background:#101016;color:white;
border:1px solid #33333e;border-radius:9px;
padding:13px;margin:8px 0;outline:none
}
input:focus,textarea:focus{border-color:#fe2c55}
.layout{
max-width:1100px;margin:auto;
display:grid;grid-template-columns:200px 1fr;
gap:20px;padding:18px
}
.sidebar{position:sticky;top:80px;height:max-content}
.nav{
display:block;width:100%;text-align:left;
background:transparent;color:white;
padding:15px;border-radius:9px;font-size:16px
}
.nav:hover,.nav.active{background:#24242e}
.page{display:none}
.page.active{display:block}
.feed{max-width:650px;margin:auto}
.post{
background:#17171f;border:1px solid #292934;
border-radius:13px;margin-bottom:18px;overflow:hidden
}
.posthead{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{
width:43px;height:43px;border-radius:50%;
background:#333;object-fit:cover
}
.media{width:100%;max-height:650px;object-fit:contain;background:black}
.actions{display:flex;gap:20px;padding:14px}
.actions button{background:none;font-size:22px}
.caption{padding:0 14px 15px}
.profilehead{display:flex;gap:20px;align-items:center;padding:20px}
.profilepic{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#333}
.stats{display:flex;gap:22px;margin:15px 0}
.stats strong{display:block;font-size:20px}
.tabs{display:flex;border-bottom:1px solid #333}
.tabs button{flex:1;background:none;padding:14px;color:white}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid img,.grid video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}
.userrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #333}
.userrow .grow{flex:1}
.follow{background:#fe2c55;padding:9px 15px;border-radius:8px}
.following{background:#333}
.bottom{
display:none;position:fixed;bottom:0;left:0;right:0;
background:#111116;justify-content:space-around;
padding:12px 2px;z-index:20;border-top:1px solid #333
}
.bottom button{background:none;color:white;font-size:12px}
.bottom b{display:block;font-size:22px}
.chatbox{height:50vh;overflow:auto;background:#101016;padding:12px}
.bubble{background:#30303b;padding:10px;border-radius:12px;margin:8px;max-width:80%}
.mine{background:#713044;margin-left:auto}
@media(max-width:700px){
.layout{display:block;padding:10px}
.sidebar{display:none}
.bottom{display:flex}
.layout main{padding-bottom:65px}
.profilepic{width:80px;height:80px}
}
</style>
</head>

<body>

<div id="auth">
<header><div class="logo">Loop<span>ly</span></div></header>
<div style="max-width:420px;margin:70px auto;padding:18px">
<div class="panel">
<h2 id="authTitle">Welcome to Looply</h2>
<p id="authDescription" style="color:#aaa;margin:10px 0">Log in to continue</p>

<form id="authForm">
<input id="fullName" class="hidden" placeholder="Full name">
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password" required>
<button class="primary" style="width:100%" id="authButton">Log in</button>
</form>

<p id="authMessage" style="margin-top:12px"></p>
<p style="margin-top:15px;color:#aaa">
<span id="switchText">New to Looply?</span>
<button id="switchAuth" style="background:none;color:#25f4ee">Sign up</button>
</p>
</div>
</div>
</div>

<div id="app" class="hidden">
<header>
<div class="logo">Loop<span>ly</span></div>
<div>
<button onclick="showPage('discover')">Search</button>
<button onclick="logout()" style="background:#292934;padding:9px;border-radius:8px">Logout</button>
</div>
</header>

<div class="layout">
<aside class="sidebar">
<button class="nav active" onclick="showPage('home')">⌂ Home</button>
<button class="nav" onclick="showPage('discover')">⌕ Discover</button>
<button class="nav" onclick="showPage('create')">＋ Create</button>
<button class="nav" onclick="showPage('inbox')">✉ Inbox</button>
<button class="nav" onclick="showPage('notifications')">♡ Notifications</button>
<button class="nav" onclick="showPage('profile')">◉ Profile</button>
</aside>

<main>

<section id="home" class="page active">
<div class="feed">
<h2 style="margin:10px 0 18px">For You</h2>
<div id="feedPosts"></div>
</div>
</section>

<section id="discover" class="page">
<h2>Discover People</h2>
<input id="searchUsers" placeholder="Search usernames...">
<div id="searchResults"></div>
</section>

<section id="create" class="page">
<h2 style="margin-bottom:15px">Create Post</h2>
<div class="panel">
<textarea id="postCaption" placeholder="What's happening?"></textarea>
<input type="file" id="postFile" accept="image/*,video/*">
<div id="preview"></div>
<button class="primary" onclick="publishPost()">Publish Post</button>
<p id="uploadMessage"></p>
</div>
</section>

<section id="inbox" class="page">
<h2>Inbox</h2>
<div id="inboxList"></div>
<div id="chatPanel" class="hidden">
<button onclick="closeChat()">← Back</button>
<h3 id="chatTitle"></h3>
<div id="chatMessages" class="chatbox"></div>
<div style="display:flex;gap:5px">
<input id="messageInput" placeholder="Write a message">
<button class="primary" onclick="sendMessage()">Send</button>
</div>
</div>
</section>

<section id="notifications" class="page">
<h2>Notifications</h2>
<div id="notificationsList" class="panel"></div>
</section>

<section id="profile" class="page">
<div id="profileContent"></div>
</section>

</main>
</div>

<nav class="bottom">
<button onclick="showPage('home')"><b>⌂</b>Home</button>
<button onclick="showPage('discover')"><b>⌕</b>Search</button>
<button onclick="showPage('create')"><b>＋</b>Create</button>
<button onclick="showPage('inbox')"><b>✉</b>Inbox</button>
<button onclick="showPage('profile')"><b>◉</b>Profile</button>
</nav>
</div>

<div id="toast" style="display:none;position:fixed;bottom:80px;background:#333;padding:13px;border-radius:9px;left:20%;z-index:30"></div>

<script>
const SUPABASE_URL = 'https://fmnlkovksnwmyultyohe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V9UwQqCiw6EoGivIjBg3A_OrAvcJuq';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let signupMode = false;
let activeChat = null;

const $ = id => document.getElementById(id);

function notify(message) {
  const t = $('toast');
  t.textContent = message;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function escapeHTML(value='') {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });

  $(page).classList.add('active');

  if(page === 'home') loadFeed();
  if(page === 'profile') loadProfile();
  if(page === 'discover') searchUsers();
  if(page === 'inbox') loadInbox();
  if(page === 'notifications') loadNotifications();
}

function switchAuth() {
  signupMode = !signupMode;

  $('authTitle').textContent =
    signupMode ? 'Create your account' : 'Welcome to Looply';

  $('authDescription').textContent =
    signupMode ? 'Join Looply today' : 'Log in to continue';

  $('fullName').classList.toggle('hidden', !signupMode);

  $('authButton').textContent =
    signupMode ? 'Sign up' : 'Log in';

  $('switchText').textContent =
    signupMode ? 'Already have an account?' : 'New to Looply?';

  $('switchAuth').textContent =
    signupMode ? 'Log in' : 'Sign up';
}

$('switchAuth').onclick = switchAuth;

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();

  $('authMessage').textContent = 'Please wait...';

  const email = $('email').value.trim();
  const password = $('password').value;

  let result;

  if(signupMode) {
    result = await db.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: $('fullName').value.trim()
        }
      }
    });
  } else {
    result = await db.auth.signInWithPassword({
      email,
      password
    });
  }

  if(result.error) {
    $('authMessage').textContent = result.error.message;
    return;
  }

  if(signupMode && !result.data.session) {
    $('authMessage').textContent =
      'Check your email to confirm your account, then log in.';
    return;
  }

  await startApp(result.data.user);
});

async function startApp(user) {
  currentUser = user;

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  await loadMyProfile();
  await loadFeed();
  await loadProfile();
}

async function loadMyProfile() {
  const {data,error} = await db
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .maybeSingle();

  if(error) {
    notify(error.message);
    return;
  }

  if(!data) {
    const name =
      currentUser.user_metadata?.full_name ||
      currentUser.email.split('@')[0];

    const result = await db.from('profiles').insert({
      id: currentUser.id,
      full_name: name,
      username: name.toLowerCase().replace(/[^a-z0-9_]/g,'')
    });

    if(result.error) {
      notify(result.error.message);
      return;
    }

    currentProfile = {
      id: currentUser.id,
      full_name: name
    };
  } else {
    currentProfile = data;
  }
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

function avatar(profile) {
  if(profile?.avatar_url) {
    return `<img class="avatar" src="${escapeHTML(profile.avatar_url)}">`;
  }

  return `<div class="avatar" style="display:grid;place-items:center">
    ${escapeHTML((profile?.full_name || '?')[0].toUpperCase())}
  </div>`;
}

async function loadFeed() {
  const result = await db
    .from('posts')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(40);

  if(result.error) {
    $('feedPosts').textContent = result.error.message;
    return;
  }

  const ids = [...new Set(
    result.data.map(p => p.user_id)
  )];

  let profiles = {};

  if(ids.length) {
    const users = await db
      .from('profiles')
      .select('*')
      .in('id',ids);

    (users.data || []).forEach(p => {
      profiles[p.id] = p;
    });
  }

  const likes = await db
    .from('likes')
    .select('post_id')
    .eq('user_id',currentUser.id);

  const liked = new Set(
    (likes.data || []).map(x => x.post_id)
  );

  $('feedPosts').innerHTML = result.data.map(post => {
    const p = profiles[post.user_id];

    const media = post.video
      ? `<video class="media" src="${escapeHTML(post.video)}" controls playsinline></video>`
      : post.image
      ? `<img class="media" src="${escapeHTML(post.image)}">`
      : '';

    return `
      <article class="post">
        <div class="posthead">
          ${avatar(p)}
          <div>
            <b>${escapeHTML(p?.full_name || 'Looply user')}</b>
            <div style="color:#aaa">@${escapeHTML(p?.username || 'user')}</div>
          </div>
        </div>

        ${media}

        <div class="actions">
          <button onclick="toggleLike('${post.id}',this)"
          class="${liked.has(post.id)?'liked':''}">
          ${liked.has(post.id)?'♥':'♡'}</button>

          <button onclick="commentPost('${post.id}')">◯</button>

          <button onclick="sharePost('${post.id}')">↗</button>
        </div>

        <div class="caption">
          ${escapeHTML(post.caption || '')}
        </div>
      </article>
    `;
  }).join('') || '<p>No posts yet. Create the first post!</p>';
}

async function toggleLike(id,button) {
  const check = await db
    .from('likes')
    .select('id')
    .eq('post_id',id)
    .eq('user_id',currentUser.id)
    .maybeSingle();

  let result;

  if(check.data) {
    result = await db
      .from('likes')
      .delete()
      .eq('id',check.data.id);
  } else {
    result = await db.from('likes').insert({
      post_id:id,
      user_id:currentUser.id
    });
  }

  if(result.error) {
    notify(result.error.message);
    return;
  }

  button.textContent = check.data ? '♡' : '♥';
  button.classList.toggle('liked',!check.data);
}

async function commentPost(id) {
  const comment = prompt('Write your comment:');

  if(!comment?.trim()) return;

  const result = await db.from('comments').insert({
    post_id:id,
    user_id:currentUser.id,
    content:comment.trim()
  });

  if(result.error) {
    notify(result.error.message);
    return;
  }

  notify('Comment posted!');
}

async function sharePost(id) {
  const url = location.href.split('#')[0] + '#post-' + id;

  if(navigator.share) {
    try {
      await navigator.share({title:'Looply',url});
    } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(url);
      notify('Link copied!');
    } catch(e) {
      notify(url);
    }
  }
}

async function publishPost() {
  const file = $('postFile').files[0];
  const caption = $('postCaption').value.trim();

  if(!file && !caption) {
    notify('Add a caption or media first');
    return;
  }

  $('uploadMessage').textContent = 'Uploading...';

  let image = null;
  let video = null;

  if(file) {
    const type = file.type.startsWith('video')
      ? 'videos'
      : 'posts';

    const path =
      currentUser.id + '/' + Date.now() + '-' +
      file.name.replace(/[^a-zA-Z0-9._-]/g,'_');

    const upload = await db.storage
      .from(type)
      .upload(path,file);

    if(upload.error) {
      $('uploadMessage').textContent = upload.error.message;
      return;
    }

    const publicURL = db.storage
      .from(type)
      .getPublicUrl(path).data.publicUrl;

    if(type === 'videos') video = publicURL;
    else image = publicURL;
  }

  const result = await db.from('posts').insert({
    user_id:currentUser.id,
    caption,
    image,
    video
  });

  if(result.error) {
    $('uploadMessage').textContent = result.error.message;
    return;
  }

  $('postCaption').value = '';
  $('postFile').value = '';
  $('uploadMessage').textContent = '';

  notify('Post published!');
  showPage('home');
}

async function loadProfile() {
  const result = await db
    .from('profiles')
    .select('*')
    .eq('id',currentUser.id)
    .single();

  if(result.error) {
    $('profileContent').textContent = result.error.message;
    return;
  }

  currentProfile = result.data;

  const posts = await db
    .from('posts')
    .select('*')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:false});

  const followers = await db
    .from('follows')
    .select('*',{count:'exact',head:true})
    .eq('following_id',currentUser.id);

  const following = await db
    .from('follows')
    .select('*',{count:'exact',head:true})
    .eq('follower_id',currentUser.id);

  $('profileContent').innerHTML = `
    <div class="profilehead">
      <img class="profilepic"
      src="${escapeHTML(currentProfile.avatar_url || '')}"
      onerror="this.style.background='#333'">

      <div>
        <h2>${escapeHTML(currentProfile.full_name || 'Your name')}</h2>
        <p>@${escapeHTML(currentProfile.username || '')}</p>

        <div class="stats">
          <div><strong>${posts.data?.length || 0}</strong>Posts</div>
          <div onclick="connections('followers')">
            <strong>${followers.count || 0}</strong>Followers
          </div>
          <div onclick="connections('following')">
            <strong>${following.count || 0}</strong>Following
          </div>
        </div>

        <button class="primary" onclick="editProfile()">Edit profile</button>
      </div>
    </div>

    <div class="tabs">
      <button>▦ Posts</button>
    </div>

    <div class="grid">
      ${(posts.data || []).map(p =>
        p.video
        ? `<video src="${escapeHTML(p.video)}" controls></video>`
        : p.image
        ? `<img src="${escapeHTML(p.image)}">`
        : `<div></div>`
      ).join('')}
    </div>

    <div id="connections"></div>
  `;
}

async function editProfile() {
  const name = prompt('Display name',currentProfile.full_name || '');
  if(name === null) return;

  const username = prompt('Username',currentProfile.username || '');
  if(username === null) return;

  const bio = prompt('Bio',currentProfile.bio || '');
  if(bio === null) return;

  const result = await db.from('profiles')
    .update({
      full_name:name,
      username:username.replace(/^@/,''),
      bio
    })
    .eq('id',currentUser.id);

  if(result.error) {
    notify(result.error.message);
    return;
  }

  notify('Profile updated!');
  loadProfile();
}

async function connections(type) {
  const column = type === 'followers'
    ? 'follower_id'
    : 'following_id';

  const filter = type === 'followers'
    ? 'following_id'
    : 'follower_id';

  const result = await db.from('follows')
    .select(column)
    .eq(filter,currentUser.id);

  const ids = (result.data || []).map(x => x[column]);

  const users = ids.length
    ? await db.from('profiles').select('*').in('id',ids)
    : {data:[]};

  $('connections').innerHTML =
    '<h3>' + type + '</h3>' +
    (users.data || []).map(p => `
      <div class="userrow">
        ${avatar(p)}
        <div class="grow">
          ${escapeHTML(p.full_name || p.username)}
          <small>@${escapeHTML(p.username || '')}</small>
        </div>
      </div>
    `).join('') || '<p>No users yet</p>';
}

async function searchUsers() {
  const q = $('searchUsers').value.trim();

  let request = db.from('profiles')
    .select('*')
    .neq('id',currentUser.id)
    .limit(30);

  if(q) {
    request = request.or(
      `full_name.ilike.%${q}%,username.ilike.%${q}%`
    );
  }

  const result = await request;

  if(result.error) {
    $('searchResults').textContent = result.error.message;
    return;
  }

  const ids = result.data.map(p => p.id);

  const follows = ids.length
    ? await db.from('follows')
      .select('following_id')
      .eq('follower_id',currentUser.id)
      .in('following_id',ids)
    : {data:[]};

  const following = new Set(
    (follows.data || []).map(x => x.following_id)
  );

  $('searchResults').innerHTML = result.data.map(p => `
    <div class="userrow">
      ${avatar(p)}
      <div class="grow">
        <b>${escapeHTML(p.full_name || 'Looply user')}</b>
        <div>@${escapeHTML(p.username || '')}</div>
      </div>

      <button class="follow ${following.has(p.id)?'following':''}"
      onclick="toggleFollow('${p.id}',this)">
        ${following.has(p.id)?'Following':'Follow'}
      </button>

      <button class="pill" onclick="openChat('${p.id}')">Message</button>
    </div>
  `).join('') || '<p>No users found</p>';
}

$('searchUsers').addEventListener('input',() => {
  clearTimeout(window.searchTimer);
  window.searchTimer = setTimeout(searchUsers,300);
});

async function toggleFollow(id,button) {
  const check = await db.from('follows')
    .select('*')
    .eq('follower_id',currentUser.id)
    .eq('following_id',id)
    .maybeSingle();

  const result = check.data
    ? await db.from('follows')
      .delete()
      .eq('follower_id',currentUser.id)
      .eq('following_id',id)
    : await db.from('follows')
      .insert({
        follower_id:currentUser.id,
        following_id:id
      });

  if(result.error) {
    notify(result.error.message);
    return;
  }

  button.textContent = check.data ? 'Follow' : 'Following';
  button.classList.toggle('following',!check.data);
}

async function loadInbox() {
  const result = await db.from('messages')
    .select('*')
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order('created_at',{ascending:false})
    .limit(100);

  if(result.error) {
    $('inboxList').textContent = result.error.message;
    return;
  }

  const ids = [...new Set(result.data.map(m =>
    m.sender_id === currentUser.id
      ? m.receiver_id
      : m.sender_id
  ))];

  const users = ids.length
    ? await db.from('profiles').select('*').in('id',ids)
    : {data:[]};

  let map = {};
  (users.data || []).forEach(p => map[p.id] = p);

  let latest = {};

  result.data.forEach(m => {
    const id = m.sender_id === currentUser.id
      ? m.receiver_id
      : m.sender_id;

    if(!latest[id]) latest[id] = m;
  });

  $('inboxList').innerHTML = Object.entries(latest).map(([id,m]) => `
    <div class="userrow" onclick="openChat('${id}')">
      ${avatar(map[id])}
      <div class="grow">
        <b>${escapeHTML(map[id]?.full_name || 'User')}</b>
        <div>${escapeHTML(m.content || '')}</div>
      </div>
    </div>
  `).join('') || '<p>Your conversations will appear here.</p>';
}

async function openChat(id) {
  const result = await db.from('profiles')
    .select('*')
    .eq('id',id)
    .single();

  if(result.error) {
    notify(result.error.message);
    return;
  }

  activeChat = id;

  $('inboxList').classList.add('hidden');
  $('chatPanel').classList.remove('hidden');
  $('chatTitle').textContent =
    result.data.full_name || result.data.username;

  await loadChat();
}

async function closeChat() {
  activeChat = null;
  $('chatPanel').classList.add('hidden');
  $('inboxList').classList.remove('hidden');
  await loadInbox();
}

async function loadChat() {
  if(!activeChat) return;

  const result = await db.from('messages')
    .select('*')
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChat}),and(sender_id.eq.${activeChat},receiver_id.eq.${currentUser.id})`
    )
    .order('created_at');

  if(result.error) {
    notify(result.error.message);
    return;
  }

  $('chatMessages').innerHTML = result.data.map(m => `
    <div class="bubble ${m.sender_id===currentUser.id?'mine':''}">
      ${escapeHTML(m.content)}
    </div>
  `).join('');

  $('chatMessages').scrollTop =
    $('chatMessages').scrollHeight;
}

async function sendMessage() {
  const content = $('messageInput').value.trim();

  if(!content || !activeChat) return;

  const result = await db.from('messages').insert({
    sender_id:currentUser.id,
    receiver_id:activeChat,
    content
  });

  if(result.error) {
    notify(result.error.message);
    return;
  }

  $('messageInput').value = '';
  await loadChat();
}

async function loadNotifications() {
  const result = await db.from('notifications')
    .select('*')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:false})
    .limit(50);

  $('notificationsList').innerHTML =
    result.error
    ? escapeHTML(result.error.message)
    : (result.data || []).map(n =>
      `<div class="userrow">♡ ${escapeHTML(n.message)}</div>`
    ).join() || '<p>No notifications yet.</p>';
}

async function start() {
  const result = await db.auth.getSession();

  if(result.data.session) {
    await startApp(result.data.session.user);
  }
}

start();
</script>
</body>
</html>
